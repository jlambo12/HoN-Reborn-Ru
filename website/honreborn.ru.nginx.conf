server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name honreborn.ru www.honreborn.ru;

    return 301 https://honreborn.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.honreborn.ru;

    ssl_certificate /etc/letsencrypt/live/honreborn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honreborn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://honreborn.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name honreborn.ru;

    root /var/www/honreborn.ru;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/honreborn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honreborn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:webp|avif|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:webm|mp4)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
