name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        default: "0.1.0-beta.15"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Resolve version and channel
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $Version = "${{ inputs.version }}"
          }
          else {
              $Version = "${{ github.ref_name }}".TrimStart("v")
          }
          $Channel = if ($Version.Contains("-")) { "beta" } else { "stable" }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$Channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Run portable unit tests
        run: python -m unittest tests/test_audit.py tests/test_launcher_release.py tests/test_live_gameplay_queue.py tests/test_validate_live_localization.py -v
      - name: Verify translation overlay
        run: python tools/verify_release.py --version ${{ steps.version.outputs.version }}
      - name: Build autonomous launcher and updater
        shell: pwsh
        run: .\scripts\build_launcher.ps1 -LauncherVersion 1.0.12
      - name: Create update manifest and assets
        shell: pwsh
        run: |
          python tools/create_update_manifest.py `
            --version "${{ steps.version.outputs.version }}" `
            --channel "${{ steps.version.outputs.channel }}" `
            --launcher-version "1.0.12" `
            --translation "release-assets\${{ steps.version.outputs.version }}\resources0.jz" `
            --launcher "dist\launcher\HoNRebornRU.exe" `
            --updater "dist\launcher\HoNRebornRU.Updater.exe" `
            --game-sha256 "1802e16e5518b729256782d2d77643c092e6300b7eb05bebd849f96545969b93" `
            --output-directory "dist\release"
          python tools/verify_update_manifest.py --directory "dist\release"
      - name: Build portable package
        shell: pwsh
        run: .\scripts\package_release.ps1 -Version ${{ steps.version.outputs.version }}
      - name: Install build-time setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build autonomous Setup.exe
        shell: pwsh
        run: .\scripts\build_setup.ps1 -Version ${{ steps.version.outputs.version }}
      - name: Create release checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "dist\release" -File |
            Where-Object Name -ne "SHA256SUMS.txt" |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -LiteralPath "dist\release\SHA256SUMS.txt" -Encoding ASCII
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: HoN-Reborn-RU-v${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = "${{ steps.version.outputs.version }}"
          $Notes = "docs/release-notes/v$Version.md"
          if (-not (Test-Path -LiteralPath $Notes)) { throw "Release notes not found: $Notes" }
          $Arguments = @(
            "release", "create", "v$Version",
            "dist/release/HoNRebornRU-Setup.exe",
            "dist/release/HoNRebornRU.exe",
            "dist/release/HoNRebornRU.Updater.exe",
            "dist/release/resources0.jz",
            "dist/release/update-manifest.json",
            "dist/release/HoN-Reborn-RU-v$Version-portable.zip",
            "dist/release/SHA256SUMS.txt",
            "--title", "HoN Reborn RU v$Version",
            "--notes-file", $Notes,
            "--verify-tag"
          )
          if ("${{ steps.version.outputs.channel }}" -eq "beta") { $Arguments += "--prerelease" }
          & gh @Arguments
