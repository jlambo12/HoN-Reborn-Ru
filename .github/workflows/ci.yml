name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    name: Localization and release checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Run portable unit tests
        run: python -m unittest tests/test_audit.py tests/test_launcher_release.py tests/test_live_gameplay_queue.py tests/test_validate_live_localization.py -v
      - name: Verify release overlay
        run: python tools/verify_release.py --version 0.1.0-beta.19
      - name: Build autonomous launcher and updater
        shell: pwsh
        run: .\scripts\build_launcher.ps1 -LauncherVersion 1.0.13
      - name: Run launcher self-test
        shell: pwsh
        run: |
          $Process = Start-Process -FilePath ".\dist\launcher\HoNRebornRU.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Launcher self-test failed with exit code $($Process.ExitCode)" }
      - name: Create and verify update assets
        shell: pwsh
        run: |
          python tools/create_update_manifest.py `
            --version "0.1.0-beta.19" `
            --channel "beta" `
            --launcher-version "1.0.13" `
            --translation "release-assets\0.1.0-beta.19\resources0.jz" `
            --launcher "dist\launcher\HoNRebornRU.exe" `
            --updater "dist\launcher\HoNRebornRU.Updater.exe" `
            --game-sha256 "b56cb49a61adf8f5e6c4a57a19de828aae9a9cfaaabf73ee0d5ad32f88c121f4" `
            --output-directory "dist\release"
          python tools/verify_update_manifest.py --directory "dist\release"
      - name: Build distributable package
        shell: pwsh
        run: .\scripts\package_release.ps1 -Version 0.1.0-beta.19

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
